<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUSYNC — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0F172A;--surface:#1E293B;--border:#334155;--primary:#6366F1;--text:#F1F5F9;--muted:#94A3B8}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center}

/* background subtle grid */
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(99,102,241,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(99,102,241,0.03) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}

.login-wrap{width:100%;max-width:440px;padding:20px}

/* Branding */
.brand{text-align:center;margin-bottom:32px}
.brand-icon{width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,#6366F1,#4F46E5);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;box-shadow:0 4px 20px rgba(99,102,241,0.4)}
.brand-icon svg{width:28px;height:28px;color:#fff}
.brand-name{font-size:24px;font-weight:700;letter-spacing:-.02em}
.brand-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* Card */
.login-card{background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px 32px;
  box-shadow:0 4px 32px rgba(0,0,0,0.4)}
.card-title{font-size:16px;font-weight:700;margin-bottom:4px}
.card-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

/* Form */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.form-control{width:100%;background:#0F172A;border:1.5px solid var(--border);
  border-radius:8px;padding:10px 14px;color:var(--text);
  font-size:14px;font-family:'Inter',sans-serif;transition:border-color .15s}
.form-control:focus{outline:none;border-color:#6366F1;
  box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.form-control::placeholder{color:#475569}

/* Role selector */
.role-tabs{display:flex;gap:8px;margin-bottom:20px}
.role-tab{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.role-tab.active{background:rgba(99,102,241,0.15);border-color:#6366F1;color:#818CF8}

/* Submit */
.btn-login{width:100%;padding:11px;border:none;border-radius:8px;
  background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
  box-shadow:0 2px 12px rgba(99,102,241,0.35);transition:all .18s;margin-top:4px}
.btn-login:hover{box-shadow:0 4px 20px rgba(99,102,241,0.55);transform:translateY(-1px)}

/* Alert */
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
  background:rgba(239,68,68,0.1);border-left:3px solid #EF4444;color:#FCA5A5}

/* Footer hint */
.login-hint{text-align:center;margin-top:20px;font-size:12px;color:#475569}

/* Glow orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:300px;height:300px;background:rgba(99,102,241,0.12);top:-80px;right:-60px}
.orb2{width:250px;height:250px;background:rgba(16,185,129,0.07);bottom:-60px;left:-40px}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="login-wrap" style="position:relative;z-index:1">
  <div class="brand">
    <div class="brand-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
    </div>
    <div class="brand-name">EDUSYNC</div>
    <div class="brand-sub">Smart Academic Staff Management Platform</div>
  </div>

  <div class="login-card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your account to continue</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">User ID</label>
        <input type="text" name="user_id" class="form-control" placeholder="Enter your ID" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>
  </div>

  
  </div>
</div>
</body>
</html>
